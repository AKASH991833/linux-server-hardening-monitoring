name: Enterprise modules
on: [push, pull_request]
permissions: {contents: read}
jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible-core
      - run: ./ansible/test.sh
      - name: Real live VM selected fixes and idempotence
        run: |
          sudo "$(command -v ansible-playbook)" -i localhost, ansible/test.yml -e hk_source=$PWD -e hk_install_dir=/opt/hk -e hk_apply=true -e '{"hk_fix_ids":["SSH-003","SSH-005","SSH-006","ACC-004","ACC-005"]}'
          sudo "$(command -v ansible-playbook)" -i localhost, ansible/test.yml -e hk_source=$PWD -e hk_install_dir=/opt/hk -e hk_apply=true -e '{"hk_fix_ids":["SSH-003","SSH-005","SSH-006","ACC-004","ACC-005"]}' | tee /tmp/second
          grep -q 'changed=0 ' /tmp/second
  incident-and-crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ./incidents/run.sh incident-output
          python3 compliance/report.py
          python3 tests/enterprise.py
      - uses: actions/upload-artifact@v4
        with:
          name: incident-report
          path: incident-output
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/work" -w /work prom/prometheus:v3.2.1 check config prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/work" -w /work prom/prometheus:v3.2.1 test rules alerts.test.yml
      - name: Start real exporter, Prometheus, Grafana
        run: docker compose -f monitoring/compose.yml up --build -d
      - name: Wait for actual metrics and dashboard
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health && curl -fsS http://localhost:9108/metrics | grep -q 'hk_exporter_success 1'; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/dashboards/uid/hk-operations | jq -e '.dashboard.panels | length == 6'
          for i in $(seq 1 30); do
            curl -fsSG http://localhost:9090/api/v1/query --data-urlencode 'query=hk_exporter_success' > /tmp/query.json
            jq -e '.data.result[0].value[1] == "1"' /tmp/query.json && break
            sleep 2
          done
          jq -e '.data.result[0].value[1] == "1"' /tmp/query.json
      - name: Screenshot live Grafana dashboard
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          node monitoring/screenshot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grafana-screenshot
          path: monitoring/screenshots
      - if: always()
        run: docker compose -f monitoring/compose.yml logs --no-color
      - if: always()
        run: docker compose -f monitoring/compose.yml down -v

  ansible-distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'debian:12', family: apt}
          - {image: 'debian:13', family: apt}
          - {image: 'rockylinux:9', family: dnf}
          - {image: 'almalinux:9', family: dnf}
          - {image: 'quay.io/centos/centos:stream9', family: dnf}
          - {image: 'fedora:latest', family: dnf}
          - {image: 'registry.access.redhat.com/ubi9/ubi:latest', family: dnf}
    container: ${{ matrix.image }}
    steps:
      - if: matrix.family == 'apt'
        run: apt-get update -qq && apt-get install -y -qq ansible-core bash git coreutils findutils procps gawk sed grep util-linux hostname python3 tar gzip
      - if: matrix.family == 'dnf'
        run: |
          dnf install -y -q git bash coreutils findutils procps-ng gawk sed grep util-linux hostname python3 python3-pip tar gzip
          if grep -qi '^ID=fedora' /etc/os-release; then dnf install -y -q ansible-core; else python3 -m pip install 'ansible-core<2.16'; fi
      - uses: actions/checkout@v4
      - run: ./ansible/test.sh
