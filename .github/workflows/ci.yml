name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S error -x hk lib/*.sh checks/*.sh tests/*.sh
      - name: Test suite (offline fixtures, no root needed)
        run: tests/run.sh
  live-root:
    # Real root on a real Ubuntu VM: audit, apply fixes, verify score goes up, roll back.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live audit as root
        run: sudo -E ./hk audit --format text | tail -15
      - name: Apply all safe fixes, then roll back
        run: |
          before=$(sudo ./hk audit --format json | grep -o '"score": [0-9]*' | grep -o '[0-9]*$')
          sudo ./hk audit --format json | jq -r '.results[]|"\(.id) \(.status)"' | sort > /tmp/before_ids.txt || true
          sudo ./hk fix --apply --all || true
          after=$(sudo ./hk audit --format json | grep -o '"score": [0-9]*' | grep -o '[0-9]*$')
          echo "score before=$before after=$after"
          test "$after" -gt "$before"
          sudo ./hk tx list
          sudo ./hk rollback "$(sudo ./hk tx list | head -1 | cut -d' ' -f1)"
          now=$(sudo ./hk audit --format json | grep -o '"score": [0-9]*' | grep -o '[0-9]*$')
          echo "score after rollback=$now (before=$before)"
          sudo ./hk audit --format json | jq -r '.results[]|"\(.id) \(.status)"' | sort > /tmp/after_rb.txt || true
          diff /tmp/before_ids.txt /tmp/after_rb.txt || true
          test "$now" -eq "$before"
      - name: Baseline and drift on the live system
        run: |
          sudo ./hk baseline create
          sudo ./hk drift
      - name: Monitor once
        run: ./hk monitor once || true
      - name: Real disk-full drill (a real filesystem filled past 90% raises CRIT)
        run: |
          dd if=/dev/zero of=/tmp/drill.img bs=1M count=24
          sudo mkfs.ext4 -q -F /tmp/drill.img
          sudo mkdir -p /tmp/drill-mnt
          sudo mount -o loop /tmp/drill.img /tmp/drill-mnt
          sudo dd if=/dev/zero of=/tmp/drill-mnt/filler bs=1M count=20 || true
          df -P /tmp/drill-mnt
          HK_ALERT_CHANNELS=log HK_CONSECUTIVE=1 HK_STATE=/tmp/hk-drill sudo -E ./hk monitor once >/dev/null || true
          grep -q 'CRIT: disk:/tmp/drill-mnt' /tmp/hk-drill/alerts.log
          sudo rm -f /tmp/drill-mnt/filler
          HK_ALERT_CHANNELS=log HK_CONSECUTIVE=1 HK_STATE=/tmp/hk-drill2 sudo -E ./hk monitor once >/dev/null || true
          ! grep -q 'CRIT: disk:/tmp/drill-mnt' /tmp/hk-drill2/alerts.log
          sudo umount /tmp/drill-mnt
      - name: Broken sshd config drill (hk validates and auto-rolls back)
        run: |
          sudo mkdir -p /etc/ssh/sshd_config.d
          echo 'GarbageDirective yes' | sudo tee /etc/ssh/sshd_config.d/98-broken.conf >/dev/null
          out=$(sudo ./hk fix --apply SSH-001 2>&1 || true)
          echo "$out"
          grep -qi 'rolling back automatically' <<<"$out"
          ! sudo sshd -t 2>/dev/null   # while the broken drop-in exists, sshd -t must fail
          sudo rm -f /etc/ssh/sshd_config.d/98-broken.conf /etc/ssh/sshd_config.d/99-hk-hardening.conf
          sudo sshd -t   # after cleanup the live config is valid again
  rhel-family:
    # Same checks across the Red Hat family: Rocky, AlmaLinux, CentOS Stream, Fedora,
    # and Red Hat UBI 9 (the free official Red Hat image - not a RHEL subscription).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky-9, alma-9, centos-stream-9, fedora-latest, ubi-9]
        include:
          - {distro: rocky-9,          image: rockylinux:9}
          - {distro: alma-9,           image: almalinux:9}
          - {distro: centos-stream-9,  image: quay.io/centos/centos:stream9}
          - {distro: fedora-latest,    image: fedora:latest}
          - {distro: ubi-9,            image: registry.access.redhat.com/ubi9/ubi:latest}
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies (dnf)
        run: dnf install -y -q git bash diffutils findutils procps-ng gawk sed grep python3 util-linux hostname shadow-utils which tar gzip
      - uses: actions/checkout@v4
      - name: Test suite on ${{ matrix.distro }}
        run: tests/run.sh
      - name: Live audit on a RHEL-family system
        run: ./hk audit --format text | tail -12
  debian:
    # The same suite plus a live audit on Debian 12 (bookworm, oldstable) and
    # Debian 13 (trixie, stable).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13]
        include:
          - {distro: debian-12, image: debian:12}
          - {distro: debian-13, image: debian:13}
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies (apt)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git bash diffutils findutils procps gawk sed grep python3 util-linux hostname passwd tar gzip ca-certificates
      - uses: actions/checkout@v4
      - name: Test suite on ${{ matrix.distro }}
        run: tests/run.sh
      - name: Live audit on a Debian system
        run: ./hk audit --format text | tail -12
