name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S error -x hk lib/*.sh checks/*.sh tests/*.sh
      - name: Test suite (offline fixtures, no root needed)
        run: tests/run.sh
  live-root:
    # Real root on a real Ubuntu VM: audit, apply fixes, verify score goes up, roll back.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live audit as root
        run: sudo -E ./hk audit --format text | tail -15
      - name: Apply all safe fixes, then roll back
        run: |
          before=$(sudo ./hk audit --format json | grep -o '"score": [0-9]*' | grep -o '[0-9]*$')
          sudo ./hk audit --format json | jq -r '.results[]|"\(.id) \(.status)"' | sort > /tmp/before_ids.txt || true
          sudo ./hk fix --apply --all || true
          after=$(sudo ./hk audit --format json | grep -o '"score": [0-9]*' | grep -o '[0-9]*$')
          echo "score before=$before after=$after"
          test "$after" -gt "$before"
          sudo ./hk tx list
          sudo ./hk rollback "$(sudo ./hk tx list | head -1 | cut -d' ' -f1)"
          now=$(sudo ./hk audit --format json | grep -o '"score": [0-9]*' | grep -o '[0-9]*$')
          echo "score after rollback=$now (before=$before)"
          sudo ./hk audit --format json | jq -r '.results[]|"\(.id) \(.status)"' | sort > /tmp/after_rb.txt || true
          diff /tmp/before_ids.txt /tmp/after_rb.txt || true
          test "$now" -eq "$before"
      - name: Baseline and drift on the live system
        run: |
          sudo ./hk baseline create
          sudo ./hk drift
      - name: Monitor once
        run: ./hk monitor once || true
  rhel-family:
    # Same checks across the Red Hat family: Rocky, AlmaLinux, CentOS Stream, Fedora,
    # and Red Hat UBI 9 (the free official Red Hat image - not a RHEL subscription).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky-9, alma-9, centos-stream-9, fedora-latest, ubi-9]
        include:
          - {distro: rocky-9,          image: rockylinux:9}
          - {distro: alma-9,           image: almalinux:9}
          - {distro: centos-stream-9,  image: quay.io/centos/centos:stream9}
          - {distro: fedora-latest,    image: fedora:latest}
          - {distro: ubi-9,            image: registry.access.redhat.com/ubi9/ubi:latest}
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies (dnf)
        run: dnf install -y -q git bash diffutils findutils procps-ng gawk sed grep python3 util-linux hostname shadow-utils which tar gzip
      - uses: actions/checkout@v4
      - name: Test suite on ${{ matrix.distro }}
        run: tests/run.sh
      - name: Live audit on a RHEL-family system
        run: ./hk audit --format text | tail -12
